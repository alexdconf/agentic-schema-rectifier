[project]
name = "schema_rectifier"
version = "0.1.0"
description = "LLM based column name rectification system"
readme = "README.md"
authors = [
    { name = "Alex DeForge", email = "alexanderdeforge@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "functions-framework>=3.10.2",
    "gcsfs>=2026.8.0",
    "google-cloud-firestore>=2.28.1",
    "google-cloud-storage>=3.13.1",
    "langchain>=1.3.15",
    "langchain-core>=1.5.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mypy>=2.3.1",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "psycopg-binary>=3.3.4",
    "psycopg-pool>=3.3.1",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.62.0",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
mypy_path = "."
explicit_package_bases = true

[tool.pyright]
extraPaths = ["."]
